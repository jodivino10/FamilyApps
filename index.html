<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>

<header class="topbar">

<div class="logo">
📷 Memories
</div>

<div class="top-icons">

<button id="uploadBtn">➕</button>

<button id="searchBtn">🔍</button>

<button id="menuBtn">☰</button>

</div>

</header>

<nav class="nav">

<button class="navBtn active">🏠</button>

<button class="navBtn">👥</button>

<button class="navBtn">📁</button>

<button class="navBtn">🎥</button>

<button class="navBtn">⭐</button>

<button class="navBtn">⚙️</button>

</nav>

<section class="albumBar">

<div id="albumList">

<button class="albumItem">
📁 Family
</button>

<button class="albumItem">
📁 Travel
</button>

<button class="albumItem">
📁 School
</button>

<button class="albumItem">
➕ Album
</button>

</div>

</section>

<main id="timeline">

<h3 class="sectionTitle">
Today
</h3>

<div id="gallery" class="gallery">

<!-- Photos appear here -->

</div>

</main>

<input
type="file"
id="fileInput"
multiple
accept="image/*,video/*"
hidden>

<script src="script.js"></script>

</body>
</html>
