<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Apps - JHANEEZ 💕</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- SECTION 1: FAMILYLOVE LOGIN SCREEN -->
    <div id="loginScreen" class="page active">
        <div class="login-wrapper">
            <h1 class="app-logo-text">FamilyLOVE</h1>
            <div class="login-card">
                <div id="loginError" class="error-msg" style="display: none; background-color: #ffebe9; color: #ce1126; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 0.9rem; font-weight: 600; border: 1px solid rgba(206,17,38,0.2);">Maling username o password!</div>
                <div class="input-group">
                    <input type="text" id="usernameInput" placeholder="Username o Email">
                </div>
                <div class="input-group password-group">
                    <input type="password" id="passwordInput" placeholder="Password">
                    <span class="view-password-icon" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1.2rem; user-select: none;">👀</span>
                </div>
                <button id="loginBtn" class="fb-login-submit-btn">Log In</button>
            </div>
        </div>
    </div>

    <!-- SECTION 2: HOME / PROFILE SCREEN (Facebook Style) -->
    <div id="homeScreen" class="page">
        <nav class="fb-navbar">
            <div class="nav-left">
                <span class="fb-logo">f</span>
                <span class="profile-name-nav" id="navProfileName">JHANEEZ 💕</span>
            </div>
            <button id="settingsTabBtn" class="fb-btn-secondary">⚙️ Settings</button>
        </nav>

        <div class="profile-container">
            <div class="cover-photo" id="coverPhotoBg">
                <label class="change-photo-btn cover-upload-label" style="position: absolute; bottom: 15px; right: 15px; background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    📷 <span>Edit Cover</span>
                    <input type="file" id="coverUploadInput" accept="image/*" style="display:none;">
                </label>
            </div>
            <div class="profile-info">
                <div class="dp-container">
                    <img src="https://picsum.photos" alt="DP" id="profileDp">
                    <label class="dp-upload-overlay" style="position: absolute; bottom: 0; left: 0; width: 100%; height: 35%; background: rgba(0,0,0,0.6); color: white; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 1.1rem;">
                        📷
                        <input type="file" id="dpUploadInput" accept="image/*" style="display:none;">
                    </label>
                </div>
                <h2 class="profile-name" id="mainProfileName">JHANEEZ 💕</h2>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="settingsPanel" class="settings-card content-container" style="display: none;">
            <h3>⚙️ Account Settings</h3>
            <div class="settings-form">
                <div class="input-group">
                    <label>Bagong Username:</label>
                    <input type="text" id="newUsername" placeholder="Ipasok ang bagong username" style="width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px;">
                </div>
                <div class="input-group">
                    <label>Bagong Password:</label>
                    <input type="password" id="newPassword" placeholder="Ipasok ang bagong password" style="width: 100%; padding: 10px; border: 1px solid #ccd0d5; border-radius: 6px;">
                </div>
                <button id="saveSettingsBtn" class="fb-btn">I-save ang Pagbabago</button>
            </div>
        </div>

        <!-- Album Dashboard Content -->
        <div id="mainDashboardContent" class="content-container">
            <div class="action-bar">
                <h3>Mga Album</h3>
                <button id="createAlbumBtn" class="fb-btn-secondary">+ Create Album</button>
            </div>
            <div class="album-grid" id="albumGrid">
                <div class="album-card" data-album-id="local-1">
                    <div class="album-cover-placeholder">📂</div>
                    <h4>Our First Date</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- SECTION 3: INSIDE ALBUM SCREEN -->
    <div id="albumViewScreen" class="page">
        <nav class="fb-navbar">
            <button id="backToHomeBtn" class="back-btn">⬅ Back</button>
            <h3 id="currentAlbumTitle">Pangalan ng Album</h3>
        </nav>

        <div class="content-container">
            <div class="upload-bar">
                <input type="file" id="mediaUploadInput" accept="image/*,video/*" multiple style="display:none;">
                <button id="triggerUploadBtn" class="fb-btn">+ Upload Photos / Videos</button>
            </div>
            <div class="media-grid" id="mediaGrid">
                <img src="https://picsum.photos" class="zoomable media-item" alt="Sample Image">
                <video src="https://w3schools.com" class="media-item clickable-video" controls muted></video>
            </div>
        </div>
    </div>

    <!-- SECTION 4: LIGHTBOX OVERLAY -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <div class="lightbox-content-wrapper" id="lightboxContent"></div>
    </div>

    <!-- INTERNAL JAVA-SCRIPT LOGIC -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            let currentUsername = "admin";
            let currentPassword = "admin123";
            let navigationHistory = ["loginScreen"];

            function navigateTo(screenId) {
                document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
                document.getElementById(screenId).classList.add("active");
                if (navigationHistory[navigationHistory.length - 1] !== screenId) {
                    navigationHistory.push(screenId);
                }
            }

            function goBack() {
                if (navigationHistory.length > 1) {
                    navigationHistory.pop();
                    const previousScreen = navigationHistory[navigationHistory.length - 1];
                    document.querySelectorAll(".page").forEach(page => page.classList.remove("active"));
                    document.getElementById(previousScreen).classList.add("active");
                    document.getElementById("settingsPanel").style.display = "none";
                    document.getElementById("mainDashboardContent").style.display = "block";
                }
            }

            // GARANTISADONG LOGIN TRIGGER HAKBANG
            document.getElementById("loginBtn").addEventListener("click", () => {
                const userInp = document.getElementById("usernameInput").value.trim();
                const passInp = document.getElementById("passwordInput").value.trim();
                const errorBox = document.getElementById("loginError");

                if (userInp === currentUsername && passInp === currentPassword) {
                    errorBox.style.display = "none";
                    navigateTo("homeScreen");
                } else {
                    errorBox.style.display = "block";
                }
            });

            // Toggle Password Indicator Icon Eye
            const passwordInput = document.getElementById("passwordInput");
            const viewPasswordIcon = document.querySelector(".view-password-icon");
            if (viewPasswordIcon && passwordInput) {
                viewPasswordIcon.addEventListener("click", () => {
                    if (passwordInput.type === "password") {
                        passwordInput.type = "text";
                        viewPasswordIcon.innerText = "🕶️";
                    } else {
                        passwordInput.type = "password";
                        viewPasswordIcon.innerText = "👀";
                    }
                });
            }

            // Settings View Navigation Switch Tab
            const settingsBtn = document.getElementById("settingsTabBtn");
            const settingsPanel = document.getElementById("settingsPanel");
            const mainDashboardContent = document.getElementById("mainDashboardContent");

            settingsBtn.addEventListener("click", () => {
                if (settingsPanel.style.display === "none") {
                    settingsPanel.style.display = "block";
                    mainDashboardContent.style.display = "none";
                    settingsBtn.innerText = "📁 Dashboard";
                } else {
                    settingsPanel.style.display = "none";
                    mainDashboardContent.style.display = "block";
                    settingsBtn.innerText = "⚙️ Settings";
                }
            });

            // Account Save settings credentials
            document.getElementById("saveSettingsBtn").addEventListener("click", () => {
                const newU = document.getElementById("newUsername").value.trim();
                const newP = document.getElementById("newPassword").value.trim();
                if (newU !== "") currentUsername = newU;
                if (newP !== "") currentPassword = newP;
                alert("Credentials changed successfully!");
                settingsPanel.style.display = "none";
                mainDashboardContent.style.display = "block";
                settingsBtn.innerText = "⚙️ Settings";
            });

            // Avatar Live Image Preview
