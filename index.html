<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Apps - Memories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Our Family Memories</h1>
        <p>Isang koleksyon ng ating mga pinahahalagang alaala.</p>
    </header>

    <main>
        <!-- Dito lalabas ang mga larawan -->
        <div class="gallery" id="galleryContainer">
            <!-- Halimbawang mga larawan. Palitan ang 'src' ng iyong Supabase URLs mamaya -->
            <div class="gallery-item">
                <img src="https://picsum.photos" alt="Memory 1" class="zoomable">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos" alt="Memory 2" class="zoomable">
            </div>
            <div class="gallery-item">
                <img src="https://picsum.photos" alt="Memory 3" class="zoomable">
            </div>
        </div>
    </main>

    <!-- Ito ang Pop-up Zoom (Lightbox Overlay) -->
    <div id="lightbox" class="lightbox">
        <span class="close-btn">&times;</span>
        <img class="lightbox-img" id="lightboxImg" src="" alt="Zoomed view">
    </div>

    <script src="script.js"></script>
</body>
</html>
