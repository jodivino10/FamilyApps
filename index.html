<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhaneez Album</title>
    <!-- Gagamit tayo ng pampublikong style para siguradong may kulay at hindi mag-error ang text layouts -->
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; }
        .hidden { display: none !important; }
        
        .topbar { height: 65px; background: #ffffff; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; box-shadow: 0 2px 10px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 999; }
        .logo { font-size: 30px; font-weight: 800; color: #1877f2; }
        .topButtons { display: flex; gap: 10px; }
        .iconBtn { width: 42px; height: 42px; border: none; border-radius: 50%; background: #edf0f5; font-size: 20px; cursor: pointer; }

        .composer { margin: 12px; background: #fff; padding: 15px; border-radius: 18px; box-shadow: 0 3px 12px rgba(0,0,0,.08); display: flex; gap: 12px; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; background: #dbe8ff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; color: #1877f2; }
        .composerBox { flex: 1; }

        .login-container { max-width: 400px; margin: 80px auto; padding: 20px; text-align: center; }
        .login-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .login-card h2 { color: #1877f2; margin-bottom: 20px; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; box-sizing: border-box; color: black; }
        .login-btn { width: 100%; background: #1877f2; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .folder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px; }
        .folder-item { background: #1877f2; color: white; padding: 25px 10px; border-radius: 14px; text-align: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(24,119,242,0.2); }
        .folder-item::before { content: "📁 "; }

        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px; }
        .photo-grid img { width: 100%; height: 110px; object-fit: cover; border-radius: 10px; background: #eee; box-shadow: 0 2px 6px rgba(0,0,0,0.05); cursor: pointer; }

        .lightbox { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .lightbox img { max-width: 95%; max-height: 85%; object-fit: contain; border-radius: 8px; box-shadow: 0 5px 25px rgba(0,0,0,0.5); }
        .lightbox-close { position: absolute; top: 20px; right: 20px; font-size: 30px; color: white; cursor: pointer; font-weight: bold; user-select: none; }
        
        .empty { background: white; padding: 45px 20px; border-radius: 20px; text-align: center; box-shadow: 0 3px 10px rgba(0,0,0,.06); margin: 12px; }
        .emptyIcon { font-size: 60px; margin-bottom: 15px; }
        .empty h2 { font-size: 32px; margin-bottom: 10px; color: black; }
        .empty p { font-size: 18px; color:#777; }
    </style>
</head>
<body>

    <!-- 1. LOGIN PAGE -->
    <div id="loginPage" class="login-container">
        <div class="login-card">
            <h2>❤️ Family Love</h2>
            <input id="username" class="login-input" placeholder="Username" value="jhan">
            <input id="password" class="login-input" type="password" placeholder="Password" value="12345">
            <button id="submitLoginBtn" class="login-btn" type="button">Login</button>
            <p id="loginMsg" style="color: red; font-weight: bold; margin-top: 10px; font-size: 14px;"></p>
        </div>
    </div>

    <!-- 2. MAIN WEBSITE -->
    <div id="mainPage" class="hidden">
        <div class="topbar">
            <div class="logo">JHANEEZ ❤️</div>
            <div class="topButtons">
                <button class="iconBtn" id="logoutBtnIcon">🚪</button>
            </div>
        </div>

        <div class="composer" style="align-items: center;">
            <div class="avatar">J</div>
            <div class="composerBox" style="text-align: left;">
                <h3 style="margin: 0; color: #1877f2;">Jhaneez Profile</h3>
                <p style="margin: 2px 0 0 0; color: #666; font-size: 14px;">Mga sub-folder at alaala ng pamilya</p>
            </div>
        </div>

        <div class="composer" style="flex-direction: column; gap: 5px;">
            <h4 style="margin: 0 0 5px 0; text-align: left; color: #333;">Gumawa ng Bagong Album</h4>
            <div style="display: flex; gap: 8px; width: 100%;">
                <input id="newAlbumName" style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 20px; background: #f0f2f5; outline: none; color: black;" placeholder="Pangalan ng Folder...">
                <button id="postBtn" style="background:#7db6ff; border:none; color:white; padding:10px 20px; border-radius:30px; font-weight:700; cursor:pointer;" onclick="createFolder()">Create</button>
            </div>
        </div>

        <div class="feed">
            <div id="emptyState" class="empty">
                <div class="emptyIcon">📂</div>
                <h2>Walang Album</h2>
                <p>Gumawa ng folder sa itaas para makapagsimula.</p>
            </div>
            <div id="folderContainer" class="folder-grid"></div>
        </div>
    </div>

    <!-- 3. INSIDE FOLDER CONTENT PAGE -->
    <div id="folderPage" class="hidden">
        <div class="topbar">
            <div class="logo" id="currentFolderName">Pangalan ng Album</div>
            <div class="topButtons">
                <button class="iconBtn" onclick="backToDashboard()">⬅️</button>
            </div>
        </div>

        <div class="composer" style="flex-direction: column; align-items: center; padding: 25px 15px;">
            <label style="color:#16a34a; font-weight:700; cursor:pointer; font-size: 18px;">
                📸 Mag-upload ng mga Litrato
                <input id="photoUpload" type="file" accept="image/*" multiple style="display: none;" onchange="uploadPhotosToFolder()">
            </label>
        </div>

        <div id="photoContainer" class="photo-grid"></div>
    </div>

    <!-- POPUP ELEMENT PARA SA ZOOM-IN IMAGE PREVIEW -->
    <div id="imageLightbox" class="lightbox hidden">
        <span class="lightbox-close" id="closeZoomX">X</span>
        <img id="lightboxImg" src="" alt="Zoomed Photo">
    </div>

<script>
    var folders = []; 
    var activeFolderId = null;

    try {
        var savedData = localStorage.getItem("jhan_albums");
        if (savedData) {
            folders = JSON.parse(savedData);
        }
    } catch (e) { folders = []; }

    function bypassToDashboard() {
        document.getElementById("loginPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");
        renderFolders(); 
    }

    bypassToDashboard();

    document.getElementById("submitLoginBtn").addEventListener("click", function() {
        var u = document.getElementById("username").value.trim();
        var p = document.getElementById("password").value.trim();
        if (u === "jhan" && p === "12345") {
            bypassToDashboard();
        } else {
            document.getElementById("loginMsg").innerHTML = "Maling username o password";
        }
    });

    document.getElementById("logoutBtnIcon").addEventListener("click", function() {
        location.reload();
    });

    function createFolder() {
        var nameInput = document.getElementById("newAlbumName");
        var folderName = nameInput.value.trim();
        if (folderName === "") return;

        var newFolder = {
            id: "folder_" + Date.now(),
            name: folderName,
            photos: [] 
        };

        if (!Array.isArray(folders)) { folders = []; }
        folders.push(newFolder);
        
        saveToDevice();
        nameInput.value = "";
        renderFolders();
    }

    function renderFolders() {
        var container = document.getElementById("folderContainer");
        var emptyState = document.getElementById("emptyState");
        if(!container || !emptyState) return;
        
        container.innerHTML = "";

        if (!Array.isArray(folders) || folders.length === 0) {
            emptyState.classList.remove("hidden");
            return;
        }

        emptyState.classList.add("hidden");
        folders.forEach(function(folder) {
            var div = document.createElement("div");
            div.className = "folder-item";
            div.innerHTML = folder.name;
            div.onclick = function() { openFolder(folder.id); };
            container.appendChild(div);
        });
    }

    function openFolder(folderId) {
        activeFolderId = folderId;
        var folder = folders.find(function(f) { return f.id === folderId; });
        if(!folder) return;

        document.getElementById("mainPage").classList.add("hidden");
        document.getElementById("folderPage").classList.remove("hidden");
        document.getElementById("currentFolderName").innerHTML = folder.name;

        renderPhotos(folder.photos);
    }

    function backToDashboard() {
        document.getElementById("folderPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");
        renderFolders();
    }

    document.getElementById("imageLightbox").addEventListener("click", function() {
        closeZoom();
    });
    document.getElementById("closeZoomX").addEventListener("click", function() {
        closeZoom();
    });
