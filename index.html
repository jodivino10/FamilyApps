<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FamilyLOVE</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<header class="topbar">

<div class="logo">
FamilyLOVE
</div>

<div class="topButtons">

<button id="settingsBtn">⚙️</button>

<button id="menuBtn">☰</button>

</div>

</header>

<nav class="tabs">

<button class="tab active">HOME</button>

<button class="tab">PHOTOS</button>

<button class="tab">VIDEOS</button>

<button class="tab">ALBUMS</button>

</nav>

<section class="composer">

<div class="avatar">
F
</div>

<div class="composerBox">

<input
type="text"
id="caption"
placeholder="What memory are you sharing today?">

<div class="composerBottom">

<label for="mediaInput" class="uploadBtn">

📷 Photo / Video

</label>

<button id="postBtn">

Post

</button>

</div>

</div>

<input
type="file"
id="mediaInput"
accept="image/*,video/*"
multiple
hidden>

</section>

<section class="feed">

<div id="emptyFeed" class="empty">

<div class="emptyIcon">
🖼️
</div>

<h2>No Memories Yet</h2>

<p>

Share your first family memory.

</p>

</div>

<div id="posts">

</div>

</section>

<script src="script.js"></script>

</body>
</html>
