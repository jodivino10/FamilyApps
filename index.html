<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Photo Albums</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="topbar">

<div class="logo">
📘 My Albums
</div>

<input type="text" id="searchBox" placeholder="Search albums...">

<button id="createAlbumBtn">
➕ New Album
</button>

</header>

<div class="container">

<aside class="sidebar">

<h3>Navigation</h3>

<ul>

<li class="active">
🏠 Home
</li>

<li>
📁 Albums
</li>

<li>
🎥 Videos
</li>

<li>
⭐ Favorites
</li>

<li>
🗑 Recycle Bin
</li>

<li>
⚙ Settings
</li>

</ul>

</aside>

<main class="content">

<h2>Your Albums</h2>

<div id="albumGrid" class="album-grid">

<!-- Albums appear here -->

</div>

</main>

</div>

<!-- Create Album Modal -->

<div id="albumModal" class="modal">

<div class="modal-content">

<h2>Create Album</h2>

<input
type="text"
id="albumName"
placeholder="Album name">

<div class="modal-buttons">

<button id="saveAlbum">
Save
</button>

<button id="cancelAlbum">
Cancel
</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
