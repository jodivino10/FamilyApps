<!DOCTYPE html>
<html lang="tl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Love</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f0f2f5;
}

.cover{
height:200px;
background:url("https://picsum.photos/900/400") center/cover;
}

.btn{
display:inline-block;
background:#1877f2;
color:white;
padding:10px 15px;
margin:10px;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.profile{
background:white;
text-align:center;
padding:20px;
position:relative;
}

.profile-pic{
width:120px;
height:120px;
border-radius:50%;
border:5px solid white;
margin-top:-80px;
object-fit:cover;
}

input[type=file]{
display:none;
}

.tabs{
display:flex;
background:white;
border-top:1px solid #ddd;
border-bottom:1px solid #ddd;
}

.tabs button{
flex:1;
padding:15px;
border:none;
background:white;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 1px 4px #ccc;
}

.post-img{
width:100%;
border-radius:10px;
}

.actions{
display:flex;
justify-content:space-around;
padding-top:10px;
font-weight:bold;
}

.family{
display:flex;
align-items:center;
gap:15px;
padding:10px;
border-bottom:1px solid #ddd;
}

.avatar{
width:50px;
height:50px;
border-radius:50%;
background:#1877f2;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:25px;
}

</style>

</head>

<body>


<div class="cover" id="cover"></div>

<label class="btn">
📷 Change Cover Photo
<input type="file" id="coverUpload" accept="image/*">
</label>



<div class="profile">

<img id="profilePic" class="profile-pic" src="https://picsum.photos/300">

<br>

<label class="btn">
👤 Change Profile Photo
<input type="file" id="profileUpload" accept="image/*">
</label>


<h1>Family Love ❤️</h1>

<p>Mga alaala at pagmamahal ng pamilya</p>

</div><div class="tabs">

<button onclick="showPage('home')">Home</button>

<button onclick="showPage('family')">Family</button>

<button onclick="showPage('photos')">Photos</button>

</div>



<div class="container">


<div id="home">

<div class="card">

<h2>Family Love ❤️</h2>

<p>
" WELCOME !!! To Family Love 💕 💕 💕 
</p>

<img class="post-img" src="https://picsum.photos/600/400">

<div class="actions">

<span>👍 Like</span>
<span>💬 Comment</span>
<span>↗ Share</span>

</div>

</div>

</div>




<div id="family" style="display:none">

<div class="card">

<h2>👨‍👩‍👧 Family Members</h2>


<div class="family">

<div class="avatar">👨</div>

<p>Father</p>

</div>


<div class="family">

<div class="avatar">👩</div>

<p>Mother</p>

</div>


<div class="family">

<div class="avatar">👦</div>

<p>Children</p>

</div>


<div class="family">

<div class="avatar">👧</div>

<p>Siblings</p>

</div>


</div>

</div>





<div id="photos" style="display:none">

<div class="card">

<h2>📷 Family Album</h2>

<img class="post-img" src="https://picsum.photos/600/401">

<img class="post-img" src="https://picsum.photos/600/402">

<img class="post-img" src="https://picsum.photos/600/403">

</div>

</div>


</div>




<script>


function showPage(page){

document.getElementById("home").style.display="none";

document.getElementById("family").style.display="none";

document.getElementById("photos").style.display="none";


document.getElementById(page).style.display="block";

}



// Cover upload

document.getElementById("coverUpload").onchange=function(e){

let reader=new FileReader();

reader.onload=function(){

document.getElementById("cover").style.backgroundImage =
"url('"+reader.result+"')";

}

reader.readAsDataURL(e.target.files[0]);

}




// Profile upload

document.getElementById("profileUpload").onchange=function(e){

let reader=new FileReader();

reader.onload=function(){

document.getElementById("profilePic").src=reader.result;

}

reader.readAsDataURL(e.target.files[0]);

}


</script>


</body>
</html>
