<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jhaneez Album</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; }
        .hidden { display: none !important; }
        
        /* Ibinalik ang orihinal mong paboritong Kulay Blue na Card */
        .card { background: blue; color: white; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); box-sizing: border-box; }
        .card h2 { margin-top: 0; color: white; }
        
        input { padding: 12px; width: 90%; border-radius: 8px; border: 1px solid #ccc; margin: 8px 0; font-size: 16px; color: black; box-sizing: border-box; display: inline-block; }
        
        /* Buton na puti at asul tulad ng disenyo mo */
        button { padding: 12px 24px; border: none; border-radius: 8px; background: white; color: blue; font-weight: bold; cursor: pointer; margin-top: 8px; font-size: 16px; }
        button:hover { background: #e6e6e6; }
        
        /* Jhaneez Profile Section (Walang Cover) */
        .profile { padding: 20px; background: white; color: black; border-bottom: 1px solid #ddd; }
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 4px solid blue; object-fit: cover; background: #eee; }
        .logout-btn { background: #e4e6eb; color: black; padding: 8px 16px; font-size: 14px; border-radius: 6px; cursor: pointer; display: inline-block; margin-top: 10px; font-weight: bold; }
        
        /* Grid para sa mga Sub-folder Albums */
        .folder-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 10px; }
        .folder-card { background: #1877f2; color: white; padding: 20px 10px; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .folder-card::before { content: "📁 "; }
        
        /* Grid ng mga larawan sa loob ng album folder */
        .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .photo-grid img { width: 100%; height: 100px; object-fit: cover; border-radius: 8px; background: #eee; }
        
        .back-btn { font-size: 25px; cursor: pointer; float: left; display: inline-block; color: white; }
        .clearfix::after { content: ""; clear: both; display: table; }
    </style>
</head>
<body>

    <!-- 1. LOGIN PAGE -->
    <div id="loginPage" style="padding-top: 80px;">
        <h1 style="color: #1877f2;">❤️ Family Love</h1>
        <div class="card">
            <h2>Login</h2>
            <input id="username" placeholder="Username">
            <br>
            <input id="password" type="password" placeholder="Password">
            <br>
            <button type="button" onclick="login()">Login</button>
            <p id="loginMsg" style="color: yellow; font-weight: bold; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD (DIRETSO JHANEEZ NA AT ISANG TAB LANG) -->
    <div id="mainPage" class="hidden">
        <div class="profile">
            <img class="profile-pic" src="https://picsum.photos">
            <h1 style="margin: 10px 0 5px 0;">❤️ JHANEEZ</h1>
            <p style="margin: 0; color: #555;">Mga sub-folder at alaala ng pamilya</p>
            <div class="logout-btn" onclick="location.reload()">🚪 Logout</div>
        </div>

        <!-- Tagagawa ng Bagong Album Folder -->
        <div class="card">
            <h2>Gumawa ng Bagong Album</h2>
            <input id="newAlbumName" placeholder="Pangalan ng Album (Folder)...">
            <br>
            <button type="button" onclick="createFolder()">➕ Create Folder</button>
        </div>

        <!-- Lalagyan ng mga Folders -->
        <div class="card" style="background: white; color: black;">
            <h3 style="text-align: left; margin-top: 0;">📂 Iyong mga Albums:</h3>
            <div id="folderContainer" class="folder-grid"></div>
        </div>
    </div>

    <!-- 3. INSIDE FOLDER PAGES (MGA LARAWAN NG ALBUM) -->
    <div id="folderPage" class="hidden">
        <div class="card clearfix">
            <div class="back-btn" onclick="backToDashboard()">⬅️</div>
            <h2 id="currentFolderName" style="display: inline-block; margin: 0 0 0 15px;">Pangalan ng Album</h2>
            <br><br>
            
            <!-- Upload Control sa loob ng napiling folder -->
            <label style="background: white; color: blue; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: inline-block; margin-bottom: 10px;">
                📸 Mag-upload ng mga Litrato
                <input id="photoUpload" type="file" accept="image/*" multiple style="display: none;" onchange="uploadPhotosToFolder()">
            </label>

            <!-- Grid kung saan mapupunta ang mga litrato -->
            <div id="photoContainer" class="photo-grid"></div>
        </div>
    </div>

<script>
    let folders = []; 
    let activeFolderId = null;

    // Selyadong login credentials para mabilis pumasok
    const savedUser = "jhan";
    const savedPass = "12345";

    // Pagkabukas ng page, kunin agad ang mga lumang album sa storage ng phone mo
    window.onload = function() {
        try {
            let savedData = localStorage.getItem("jhan_albums");
            if (savedData) {
                folders = JSON.parse(savedData);
            }
        } catch (e) {
            folders = [];
        }
    };

    // Independent Login Engine (Hinding-hindi mag-eerror o mag-lo-loading)
    function login() {
        const u = document.getElementById("username").value.trim();
        const p = document.getElementById("password").value.trim();

        if (u === savedUser && p === savedPass) {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("mainPage").classList.remove("hidden");
            renderFolders(); 
        } else {
            document.getElementById("loginMsg").innerHTML = "Maling username o password";
        }
    }

    // Paggawa ng Folder Album
    function createFolder() {
        const nameInput = document.getElementById("newAlbumName");
        const folderName = nameInput.value.trim();
        if (folderName === "") return;

        const newFolder = {
            id: "folder_" + Date.now(),
            name: folderName,
            photos: [] 
        };

        if (!Array.isArray(folders)) { folders = []; }
        folders.push(newFolder);
        
        saveToDevice();
        nameInput.value = "";
        renderFolders();
    }

    // Tagasulat ng Folder Cards sa screen
    function renderFolders() {
        const container = document.getElementById("folderContainer");
        if(!container) return;
        container.innerHTML = "";

        if (!Array.isArray(folders) || folders.length === 0) {
            container.innerHTML = "<p style='color: #888; grid-column: 1/-1; margin: 10px 0;'>Wala pang nagagawang folder. Gumawa muna sa itaas.</p>";
            return;
        }

        folders.forEach(folder => {
            const div = document.createElement("div");
            div.className = "folder-card";
            div.innerHTML = folder.name;
            div.onclick = function() { openFolder(folder.id); };
            container.appendChild(div);
        });
    }

    // Pagbukas ng Folder Album
    function openFolder(folderId) {
        activeFolderId = folderId;
        const folder = folders.find(f => f.id === folderId);
        if(!folder) return;

        document.getElementById("mainPage").classList.add("hidden");
        document.getElementById("folderPage").classList.remove("hidden");
        document.getElementById("currentFolderName").innerHTML = folder.name;

        renderPhotos(folder.photos);
    }

    function backToDashboard() {
        document.getElementById("folderPage").classList.add("hidden");
        document.getElementById("mainPage").classList.remove("hidden");
        renderFolders();
    }

    // Pagpapakita ng mga Larawan sa loob ng folder
    function renderPhotos(photoArray) {
        const container = document.getElementById("photoContainer");
        if(!container) return;
        container.innerHTML = "";

        if (!photoArray || photoArray.length === 0) {
            container.innerHTML = "<p style='grid-column: 1/-1; padding: 20px 0;'>Wala pang larawan sa album na ito.</p>";
            return;
        }

        photoArray.forEach(url => {
            const img = document.createElement("img");
            img.src = url;
            container.appendChild(img);
        });
    }

    // Instant Upload gamit ang luma at mabilis mong FileReader
    function uploadPhotosToFolder() {
        const fileInput = document.getElementById("photoUpload");
        if(!fileInput || fileInput.files.length === 0) return;
        const files = fileInput.files;

        const folder = folders.find(f => f.id === activeFolderId);
        if(!folder) return;

        let loadedCount = 0;
        for (let file of files) {
            const r = new FileReader();
            r.onload = function() {
                if(!folder.photos) { folder.photos = []; }
                folder.photos.push(r.result);
                
                loadedCount++;
                if (loadedCount === files.length) {
                    saveToDevice();
                    renderPhotos(folder.photos); 
                }
            };
            r.readAsDataURL(file);
        }
    }

    // Tagatabi ng Data sa mismong Storage ng Cellphone/Computer para hindi mabura kapag nag-refresh
    function saveToDevice() {
        try {
            localStorage.setItem("jhan_albums", JSON.stringify(folders));
        } catch(e) {
            alert("Puno na ang local space ng iyong browser para sa maramihang malalaking litrato.");
