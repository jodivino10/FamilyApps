<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JHANEEZ Family</title>

<style>

*{
 box-sizing:border-box;
 font-family:Arial, sans-serif;
}

body{
 margin:0;
 background:#f0f2f5;
}


/* TOP HEADER */
.header{
 background:#1877f2;
 color:white;
 padding:15px;
 text-align:center;
 font-size:28px;
 font-weight:bold;
}


/* PROFILE */
.profile-container{
 background:white;
}

.cover-photo{
 width:100%;
 height:130px;
 object-fit:cover;
}


.profile-photo{
 width:150px;
 height:150px;
 border-radius:50%;
 border:5px solid white;
 object-fit:cover;
 margin-top:-75px;
 margin-left:20px;
}


.profile-name{
 font-size:25px;
 font-weight:bold;
 margin:10px 20px;
}


/* TABS */
.tabs{
 display:flex;
 overflow-x:auto;
 background:white;
 border-top:1px solid #ddd;
 border-bottom:1px solid #ddd;
}


.tab{
 padding:14px 20px;
 cursor:pointer;
 font-weight:bold;
 white-space:nowrap;
}


.tab:hover{
 background:#e4e6eb;
}


/* PAGE */
.page{
 display:none;
 padding:15px;
}


.page.active{
 display:block;
}


/* CARD */
.card{
 background:white;
 padding:18px;
 border-radius:12px;
 margin-bottom:15px;
 box-shadow:0 1px 3px #ccc;
}


/* BUTTON */
.upload-button{
 background:#1877f2;
 color:white;
 border:0;
 padding:12px 20px;
 border-radius:8px;
 font-size:16px;
 cursor:pointer;
}


/* UPLOAD ICON */
.camera{
 font-size:55px;
 cursor:pointer;
 text-align:center;
}


.photo-grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:10px;
}


.photo-box{
 height:130px;
 background:#ddd;
 border-radius:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:35px;
}


</style>

</head>

<body>


<div class="header">
JHANEEZ
</div>


<div class="profile-container">

<img class="cover-photo"
src="cover.jpg">


<img class="profile-photo"
src="profile.jpg">


<div class="profile-name">
JHANEEZ Family
</div>


</div>



<div class="tabs">

<div class="tab" onclick="showPage('home')">
🏠 Home
</div>


<div class="tab" onclick="showPage('photos')">
📷 Photos
</div>


<div class="tab" onclick="showPage('family')">
👨‍👩‍👧 Family
</div>


<div class="tab" onclick="showPage('memories')">
💙 Memories
</div>


</div>



<div id="home" class="page active">


<div class="card">

<h2>Home</h2>

<p>
Welcome sa JHANEEZ Family website.
</p>


<button class="upload-button"
onclick="showPage('photos')">

📷 Upload Photos

</button>


</div>


</div><div id="photos" class="page">

<div class="card">

<h2>Photos</h2>

<p>
Your photo collection
</p>


<div class="camera" onclick="demoUpload()">
📷
</div>


<p style="text-align:center;color:gray;">
Upload Photos (Demo lang muna)
</p>


<div class="photo-grid">

<div class="photo-box">🖼️</div>

<div class="photo-box">🖼️</div>

<div class="photo-box">🖼️</div>

<div class="photo-box">🖼️</div>

</div>


</div>

</div>



<div id="family" class="page">

<div class="card">

<h2>Family</h2>

<p>
Family memories and pictures.
</p>


<div class="camera" onclick="showPage('photos')">
📷
</div>


</div>

</div>



<div id="memories" class="page">

<div class="card">

<h2>Memories</h2>

<p>
Special moments of JHANEEZ Family.
</p>


<div class="camera" onclick="showPage('photos')">
📷
</div>


</div>

</div>



<script>

function showPage(pageName){

let pages = document.querySelectorAll(".page");


pages.forEach(function(page){

page.classList.remove("active");

});


document.getElementById(pageName).classList.add("active");

}



function demoUpload(){

alert("Upload Photos feature: Demo mode lang muna.");

showPage("photos");

}


</script>


</body>

</html>
