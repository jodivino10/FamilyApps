<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Love</title>
    <!-- Supabase Library -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; }
        .hidden { display: none !important; }
        
        /* Ibinaba at ibinalik ang Kulay Blue na Card mo para sa Login at Albums */
        .card { background: blue; color: white; padding: 20px; border-radius: 12px; margin: 15px auto; max-width: 450px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .card h2 { margin-top: 0; color: white; }
        
        input { padding: 12px; width: 80%; border-radius: 8px; border: 1px solid #ccc; margin: 8px 0; font-size: 16px; }
        
        /* Buton na may kulay puti at asul tulad ng orihinal mong code */
        button { padding: 12px 24px; border: none; border-radius: 8px; background: white; color: blue; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 16px; }
        button:hover { background: #e6e6e6; }
        
        .tabs { display: flex; background: white; margin-bottom: 15px; border-bottom: 1px solid #ddd; }
        .tabs button { flex: 1; border-radius: 0; background: none; color: #1877f2; padding: 15px; margin: 0; border: none; cursor: pointer; font-size: 14px; }
        .tabs button.active { background: #f0f2f5; border-bottom: 3px solid #1877f2; font-weight: bold; }
        
        .album { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
        .img-container { position: relative; width: 100%; height: 90px; }
        .album img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; background: #eee; }
        .del-btn { position: absolute; top: 4px; right: 4px; background: rgba(255, 0, 0, 0.9); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; padding: 0; }
        
        .logout-btn { background: #e4e6eb; color: black; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; display: inline-block; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- 1. LOGIN PAGE -->
    <div id="loginPage" style="padding-top: 80px;">
        <h1 style="color: #1877f2;">❤️ Family Love</h1>
        <div class="card">
            <h2>Login</h2>
            <input id="username" placeholder="Username">
            <input id="password" type="password" placeholder="Password"><br>
            <button onclick="login()">Login</button>
            <p id="loginMsg" style="color: yellow; font-weight: bold;"></p>
        </div>
    </div>

    <!-- 2. MAIN WEBSITE -->
    <div id="mainPage" class="hidden">
        <div style="padding: 20px 10px 5px 10px;">
            <h1 style="color: #1877f2;">Family Love ❤️</h1>
            <div class="logout-btn" onclick="location.reload()">🚪 Logout</div>
        </div>

        <!-- Navigation Tabs -->
        <div class="tabs">
            <button id="tab-Father" onclick="changeTab('Father')" class="active">Father</button>
            <button id="tab-Mother" onclick="changeTab('Mother')">Mother</button>
            <button id="tab-Children" onclick="changeTab('Children')">Children</button>
            <button id="tab-Jhaneez" onclick="changeTab('Jhaneez')">Jhaneez</button>
        </div>

        <!-- Dynamic Photo Album Section -->
        <div class="card">
            <h2 id="albumTitle">Father's Album</h2>
            
            <!-- Upload Controls -->
            <label style="background: white; color: blue; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; display: inline-block; margin-bottom: 10px;">
                ➕ Magdagdag ng Larawan
                <input id="photoUpload" type="file" accept="image/*" multiple style="display: none;" onchange="uploadPhotos()">
            </label>

            <!-- Container kung saan lalabas ang mga pictures -->
            <div id="photoGrid" class="album"></div>
        </div>
    </div>

<script>
    // Configuration
    const SUPABASE_URL = "https://gbtrhsmymwkzfpmfxoiw.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Nqn5bv72ij34yLsA1d3RnA_rNqqDz5Y"; 

    const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentCategory = "Father";

    // Ligtas na Login Engine (May backup system kapag offline o walang table ang database)
    async function login() {
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        let dbUser = "jhan";
        let dbPass = "12345";

        try {
            // Sinusubukang kumuha ng data sa Supabase Profiles table mo
            const { data, error } = await supabase.from('profiles').select('*').eq('id', 'primary_account').single();
            if (data && !error) {
                dbUser = data.username;
                dbPass = data.password;
            }
        } catch (e) {
            console.log("Database connection bypass - gamit ang manual fallback login.");
        }

        // Tinitiyak na makakapasok ka kahit ano mang mangyari sa database query mo
        if (u === dbUser && p === dbPass) {
            document.getElementById("loginPage").classList.add("hidden");
            document.getElementById("mainPage").classList.remove("hidden");
            loadAlbum("Father"); 
        } else {
            document.getElementById("loginMsg").innerHTML = "Maling username o password";
        }
    }

    // Tab Switcher
    function changeTab(category) {
        currentCategory = category;
        document.getElementById("albumTitle").innerHTML = category + "'s Album";
        
        ['Father', 'Mother', 'Children', 'Jhaneez'].forEach(cat => {
            document.getElementById(`tab-${cat}`).classList.remove("active");
        });
        document.getElementById(`tab-${category}`).classList.add("active");

        loadAlbum(category);
    }

    // Load Photos from Cloud Database
    async function loadAlbum(category) {
        const grid = document.getElementById("photoGrid");
        grid.innerHTML = "Loading photos...";

        const { data, error } = await supabase.from('gallery_photos').select('*').eq('category', category).order('created_at', { ascending: false });

        grid.innerHTML = "";
        if (error) { grid.innerHTML = "Wala pang larawan dito o mag-upload pa lamang."; return; }

        data.forEach(photo => {
            const container = document.createElement("div");
            container.className = "img-container";

            const img = document.createElement("img");
            img.src = photo.image_url;

            const delBtn = document.createElement("button");
            delBtn.className = "del-btn";
            delBtn.innerHTML = "X";
            delBtn.onclick = function() { deletePhoto(photo.id, photo.image_url); };

            container.appendChild(img);
            container.appendChild(delBtn);
            grid.appendChild(container);
        });
    }

    // Upload Engine
    async function uploadPhotos() {
        const files = document.getElementById("photoUpload").files;
        if (files.length === 0) return;

        for (let file of files) {
            const fileName = `albums/${currentCategory}/${Date.now()}-${file.name}`;
            const { error } = await supabase.storage.from('photos').upload(fileName, file);

            if (!error) {
                const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/photos/${fileName}`;
                await supabase.from('gallery_photos').insert([{ category: currentCategory, image_url: publicUrl }]);
            } else {
                alert("Upload Error: " + error.message + " (Siguraduhing 'Public' ang photos bucket mo sa Supabase Storage)");
            }
        }
        loadAlbum(currentCategory); 
    }

    // Delete Engine
    async function deletePhoto(id, imageUrl) {
        if (!confirm("Sigurado ka bang gusto mong burahin ang larawang ito?")) return;

        const urlParts = imageUrl.split('/public/photos/');
        if(urlParts.length < 2) return;
        const filePath = urlParts[1];

        const { error: storageError } = await supabase.storage.from('photos').remove([filePath]);
        const { error: dbError } = await supabase.from('gallery_photos').delete().eq('id', id);

        if (storageError || dbError) {
            alert("May kaunting error sa pagbura, ngunit sinusubukan i-refresh.");
        }
        loadAlbum(currentCategory);
    }
</script>
</body>
</html>
