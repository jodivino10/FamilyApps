<!DOCTYPE html>
<html lang="tl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Family Love</title>

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f0f2f5;
}

.hidden{
display:none;
}

.cover{
height:200px;
background:url("https://picsum.photos/900/400") center/cover;
position:relative;
}

.icon-btn{
width:40px;
height:40px;
border-radius:50%;
background:#1877f2;
color:white;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:22px;
border:3px solid white;
}

.cover-upload{
position:absolute;
right:15px;
bottom:15px;
}

.profile{
background:white;
text-align:center;
padding:20px;
position:relative;
}

.profile-pic{
width:120px;
height:120px;
border-radius:50%;
border:5px solid white;
object-fit:cover;
margin-top:-80px;
}

.profile-upload{
margin:auto;
margin-top:-25px;
position:relative;
z-index:2;
}

.tabs{
display:flex;
background:white;
border-top:1px solid #ddd;
border-bottom:1px solid #ddd;
}

.tabs button{
flex:1;
padding:15px;
border:none;
background:white;
font-weight:bold;
cursor:pointer;
}

.container{
padding:15px;
}

.card{
background:white;
border-radius:12px;
padding:15px;
margin-bottom:15px;
box-shadow:0 1px 4px #ccc;
}

.member{
display:flex;
align-items:center;
gap:15px;
padding:12px;
border-bottom:1px solid #ddd;
cursor:pointer;
}

.member img{
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
}

.small-icon{
width:30px;
height:30px;
border-radius:50%;
background:#1877f2;
color:white;
display:flex;
align-items:center;
justify-content:center;
margin-left:auto;
}

.album{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px;
}

.album img{
width:100%;
height:100px;
object-fit:cover;
border-radius:8px;
}

.back{
font-size:28px;
cursor:pointer;
}

</style>

</head>


<body>


<div id="mainPage">


<div class="cover" id="cover">

<label class="icon-btn cover-upload">

📷

<input id="coverUpload" type="file" accept="image/*" class="hidden">

</label>

</div>



<div class="profile">


<img id="profilePic" class="profile-pic" src="https://picsum.photos/300">


<label class="icon-btn profile-upload">

📷

<input id="profileUpload" type="file" accept="image/*" class="hidden">

</label>


<h1>Family Love ❤️</h1>

<p>Mga alaala at pagmamahal ng pamilya</p>


</div>



<div class="tabs">

<button onclick="openTab('home')">Home</button>

<button onclick="openTab('family')">Family</button>

<button onclick="openTab('photos')">Photos</button>

</div>


<div class="container">


<div id="home" class="card">

<h2>Welcome ❤️</h2>

<p>
Maligayang pagdating sa aming Family Love page.
</p>

</div>



<div id="family" class="card hidden">

<h2>👨‍👩‍👧 Family Members</h2>


<div class="member" onclick="openMember('father')">

<img src="https://picsum.photos/100?1">

<b>Father</b>

<div class="small-icon">📷</div>

</div>


<div class="member" onclick="openMember('mother')">

<img src="https://picsum.photos/100?2">

<b>Mother</b>

<div class="small-icon">📷</div>

</div>


<div class="member" onclick="openMember('child')">

<img src="https://picsum.photos/100?3">

<b>Children</b>

<div class="small-icon">📷</div>

</div>


</div><div id="photos" class="card hidden">

<h2>📷 Family Album</h2>

<div class="album">

<img src="https://picsum.photos/300?10">
<img src="https://picsum.photos/300?11">
<img src="https://picsum.photos/300?12">

</div>

</div>


</div>

</div>



<!-- MEMBER PROFILE PAGE -->

<div id="memberPage" class="hidden">

<div class="card">

<div class="back" onclick="backHome()">
⬅️
</div>


<h2 id="memberName">Family Member</h2>


<img id="memberPic"
src="https://picsum.photos/300"
style="width:120px;height:120px;border-radius:50%;object-fit:cover;">


<br>


<label class="icon-btn">

📷

<input id="memberUpload" type="file" accept="image/*" class="hidden">

</label>


<h3>📷 Album</h3>


<label class="icon-btn">

➕

<input id="albumUpload" type="file" accept="image/*" multiple class="hidden">

</label>


<div id="memberAlbum" class="album">

<img src="https://picsum.photos/300?20">

<img src="https://picsum.photos/300?21">

</div>


</div>

</div>




<script>


// Tabs

function openTab(tab){

document.getElementById("home").classList.add("hidden");

document.getElementById("family").classList.add("hidden");

document.getElementById("photos").classList.add("hidden");


document.getElementById(tab).classList.remove("hidden");

}



// Open member profile

let currentMember="";


function openMember(name){

currentMember=name;

document.getElementById("mainPage").classList.add("hidden");

document.getElementById("memberPage").classList.remove("hidden");


let title="";


if(name=="father"){
title="Father";
}

if(name=="mother"){
title="Mother";
}

if(name=="child"){
title="Children";
}


document.getElementById("memberName").innerHTML=title;

}




function backHome(){

document.getElementById("memberPage").classList.add("hidden");

document.getElementById("mainPage").classList.remove("hidden");

}



// Cover Upload

document.getElementById("coverUpload").onchange=function(e){

let reader=new FileReader();

reader.onload=function(){

document.getElementById("cover").style.backgroundImage=
"url('"+reader.result+"')";

}

reader.readAsDataURL(e.target.files[0]);

}




// Profile Upload

document.getElementById("profileUpload").onchange=function(e){

let reader=new FileReader();

reader.onload=function(){

document.getElementById("profilePic").src=reader.result;

}

reader.readAsDataURL(e.target.files[0]);

}




// Member Profile Upload

document.getElementById("memberUpload").onchange=function(e){

let reader=new FileReader();

reader.onload=function(){

document.getElementById("memberPic").src=reader.result;

}

reader.readAsDataURL(e.target.files[0]);

}




// Multiple Album Upload

document.getElementById("albumUpload").onchange=function(e){

let files=e.target.files;


for(let i=0;i<files.length;i++){

let reader=new FileReader();


reader.onload=function(){

let img=document.createElement("img");

img.src=reader.result;

document.getElementById("memberAlbum").appendChild(img);

}


reader.readAsDataURL(files[i]);

}


}


</script>


</body>

</html>
